# Local PostgreSQL for development and tests (optional — only needed on your own computer).
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: codenest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codenest
      POSTGRES_PASSWORD: codenest
      POSTGRES_DB: codenest
    ports:
      - "5432:5432"
    volumes:
      - codenest-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codenest -d codenest"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local S3-compatible server (same API as Cloudflare R2), used by the storage
  # integration tests:  docker compose --profile s3 up -d   (local-only test credentials)
  s3:
    image: chrislusf/seaweedfs:3.97
    container_name: codenest-s3
    profiles: ["s3"]
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"

volumes:
  codenest-data:
