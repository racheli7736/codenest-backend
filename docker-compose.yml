# Local PostgreSQL for development and tests (optional — only needed on your own computer).
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: codenest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codenest
      POSTGRES_PASSWORD: codenest
      POSTGRES_DB: codenest
    ports:
      - "5432:5432"
    volumes:
      - codenest-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codenest -d codenest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codenest-data:
